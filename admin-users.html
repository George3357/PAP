<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - Admin Panel | CarDealz</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-group label {
            font-weight: 500;
            min-width: 80px;
        }
        
        .admin-nav {
            display: flex;
            margin-bottom: 20px;
            background: white;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .admin-nav a {
            padding: 10px 15px;
            margin-right: 10px;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .admin-nav a:hover {
            background-color: #f5f5f5;
        }
        
        .admin-nav a.active {
            background-color: #007bff;
            color: white;
        }
        
        .user-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .user-detail-content {
            background-color: white;
            margin: 50px auto;
            padding: 25px;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .user-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .user-form-group {
            margin-bottom: 15px;
        }
        
        .user-form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .user-form-group input,
        .user-form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .user-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .role-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .role-admin {
            background-color: #d4edda;
            color: #155724;
        }
        
        .role-user {
            background-color: #cce5ff;
            color: #004085;
        }
        
        .create-user-btn {
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: auto;
        }
        
        .create-user-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="admin-header">
            <h1>Painel Administrativo</h1>
            <div class="admin-actions">
                <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Voltar ao Site</a>
                <button id="admin-logout" class="btn-danger"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </header>
        
        <div class="admin-nav">
            <a href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="admin-stats.html"><i class="fas fa-chart-line"></i> Estatísticas</a>
            <a href="admin-users.html" class="active"><i class="fas fa-users"></i> Usuários</a>
            <a href="admin-orders.html"><i class="fas fa-shopping-cart"></i> Pedidos</a>
            <a href="admin-images.html"><i class="fas fa-images"></i> Imagens</a>
        </div>
        
        <div class="admin-content">
            <div class="admin-section-header">
                <h2>Gerenciar Usuários</h2>
                <div class="admin-section-actions">
                    <button id="create-user" class="create-user-btn"><i class="fas fa-plus"></i> Novo Usuário</button>
                    <button id="refresh-users" class="btn-primary"><i class="fas fa-sync-alt"></i> Atualizar</button>
                </div>
            </div>
            
            <div class="filter-bar">
                <div class="filter-group">
                    <label for="role-filter">Função:</label>
                    <select id="role-filter" class="status-selector">
                        <option value="all">Todos</option>
                        <option value="admin">Administrador</option>
                        <option value="user">Usuário</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="date-filter">Registro:</label>
                    <select id="date-filter" class="status-selector">
                        <option value="all">Todos</option>
                        <option value="today">Hoje</option>
                        <option value="week">Esta Semana</option>
                        <option value="month">Este Mês</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="search-user">Buscar:</label>
                    <input type="text" id="search-user" placeholder="Nome, email ou ID" class="status-selector">
                </div>
            </div>
            
            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Função</th>
                            <th>Data de Registro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <!-- Users will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- User Detail Modal -->
    <div id="user-detail-modal" class="user-detail-modal">
        <div class="user-detail-content">
            <div class="user-header">
                <h2>Detalhes do Usuário</h2>
                <span class="modal-close" id="user-modal-close">&times;</span>
            </div>
            
            <div id="user-form">
                <input type="hidden" id="user-id">
                <div class="user-info">
                    <div class="user-form-group">
                        <label for="user-name">Nome</label>
                        <input type="text" id="user-name" required>
                    </div>
                    
                    <div class="user-form-group">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" required>
                    </div>
                    
                    <div class="user-form-group">
                        <label for="user-phone">Telefone</label>
                        <input type="text" id="user-phone">
                    </div>
                    
                    <div class="user-form-group">
                        <label for="user-role">Função</label>
                        <select id="user-role">
                            <option value="user">Usuário</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    
                    <div class="user-form-group">
                        <label for="user-password">Senha (deixe em branco para manter)</label>
                        <input type="password" id="user-password">
                    </div>
                    
                    <div class="user-form-group">
                        <label for="user-created">Data de Registro</label>
                        <input type="text" id="user-created" disabled>
                    </div>
                </div>
                
                <div class="user-actions">
                    <button id="delete-user" class="btn-danger"><i class="fas fa-trash"></i> Excluir Usuário</button>
                    <button id="save-user" class="btn-primary"><i class="fas fa-save"></i> Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/admin-users.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
